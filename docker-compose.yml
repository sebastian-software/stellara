# SSRF defense in depth
# ---------------------
# Stellara validates user-supplied URLs before forwarding them to Firecrawl,
# but DNS can change between validation and the upstream request. Firecrawl
# runs separately; verify SSRF controls for its deployed version and test that
# its egress cannot reach local or internal addresses. Firecrawl recommends a
# secure egress proxy for OSS Playwright services:
# https://github.com/firecrawl/firecrawl/security/advisories/GHSA-vjp8-2wgg-p734
# See docs/operations/betrieb.md for the deployment procedure.
services:
  stellara:
    image: ${STELLARA_IMAGE:-ghcr.io/sebastian-software/stellara:0.1.15}
    container_name: stellara
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - internal
      - proxy
    expose:
      - "8787"
    # OAuth persistence (clients, refresh tokens, sessions, signing key)
    # lives in /data/stellara.db. A bind mount next to the compose file
    # keeps the SQLite database visible on the host so backups and
    # ownership fixes can be done with standard tools; the container runs
    # as UID/GID 999 (see Dockerfile), so the host directory must be
    # owned by 999:999. See docs/operations/betrieb.md#volume-mount.
    volumes:
      - ./stellara-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # The Playwright-backed browser tools bundle Chromium into
    # the runtime image; each active session reserves ~200-400 MB of RAM
    # for its browser context. Capping at 1.5 GB covers the default of
    # three parallel sessions plus the Node.js heap with comfortable
    # headroom; lower this if the tools are disabled via
    # `STELLARA_PLAYWRIGHT_ENABLED=false`.
    mem_limit: 1536m
    cpus: 1.0

networks:
  internal:
    external: true
  proxy:
    external: true
    name: ${STELLARA_PROXY_NETWORK:?Set STELLARA_PROXY_NETWORK to the external proxy network name}
